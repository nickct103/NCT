        /*
            # Functions in JavaScript
                - A set/block of code which is intended to perform a particular task
                - Function can be executed as many times as needed
                - Advantages of functions:
                    - Avoid repeated code (redundancy)
                        - DRY principle- Don't Repeat Yourself
                    - Code reusability
                    - Modular code (organized code)
                - For any function to be executed in JavaScript. it needs two steps:
                    1. Function Declaration/Definition
                    2. Function Call/Invocation/Execution (Calling the function)
                - Types of functions:
                    - Standard functions
                    - Anonymous functions (Does not have a name)
                        -Used as a function expression and assigned to a variable

                - Syntax:
                    - Declaration:
                        -Standard Function:
                        function functionName(parameters) {
                            // code to be executed
                        }

                        -Anonymous Function Expression:
                        let functionName = function(parameters) {
                            // code to be executed
                        }
                        
                    - Invocation:
                        functionName(arguments);

                - Parameters vs Arguments:
                    - Can make functions more dynamic by using parameters and arguments
                        - Parameters: Variables listed as a part of the function definition
                        - Arguments: Actual values passed to the function when calling/invoking it
                    - Syntax:
                        - Declaration:
                            - function functionName(parameter1, parameter2) { // parameters
                            // code to be executed
                        }
                        - Invocation:
                            - functionName(argument1, argument2); // arguments
                    - 'return' Statement:
                        - Used to return a value from a function
                        - Syntax:
                            - return value;
                        - When a return statement is executed, the function stops executing and returns the specified value to the caller
        */
