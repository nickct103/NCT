    <script>
        /*
            # Arrays in JavaScript: Collection of multiple elements
                - Syntax: let array = [element1, element2, element3, ...];
                - Can hold elements of different data types
                    - let array = [1, 'two', true, null, undefined, {key: 'value'}, [1, 2, 3]];
                - Access elements using index (0-based)
                    - Syntax: array[index]
                    - Index: the poisition of an element in the array, starting from 0
                - Update elements using index
                    - Syntax: array[index] = newValue
                    - Append element to the end of the array using length property
                        - Syntax: array[array.length] = newValue
                - Iterate an array (using loops concept)
                    - Syntax:
                        - for(let i = 0, i < array.length, i++  )
                    - for...of loop
                    - forEach() method 
                - Multi-dimensional arrays (Arrays of arrays): Nested arrays
                    - Example: arr2 = [[2, 4], [3, 5]]
                - Properties: 
                    - length: Total number of elements in the array
                - Methods:
                    - push(newElements)**: Add one or more elements to the end of an array
                        - Will update the original array
                        - Returns the updated length of the array
                    - pop()**: Remove the last element from an array
                        - Will update the original array
                        - Returns the removed element of the array
                    - shift(): Remove the first element from an array
                    - unshift(): Add one or more elements to the beginning of an array
                    - indexOf()** : Return the first index of a specified element, else returns -1
                    - lastIndexOf(): Return the last index of a specified element, else returns -1
                    - includes(): Check if an array contains a specified element, returns true or false
                    - slice(): Return a shallow copy of a portion of an array into a new array object
                    - splice(): Add/Remove elements from an array at a specified index
                    - concat(): Merge two or more arrays into a new array
                    - join(): Join all elements of an array into a string, with a specified separator
                        - Convert array to string
                        - Will not update the original array
                        - Returns the joined string
                        - Notes: If no separator is provided, a comma (,) is used by default. Separator: join elements separated by the separator.
                    - concat(): Merge two or more arrays into a new array
                        - Will not update the original array
                        - Returns the merged array
                    - sort(): Sort the elements of an array in place and return the sorted array
                    - reverse(): Reverse the order of the elements in an array in place
                    - split(): Split a string to form elements of an array, based on a specified separator
                        - Convert string to array
                        - Will not update the original string
                        - Returns the new array
                        - Notes: If no separator is provided, the entire string is returned as the only element of the array
                           
        */
