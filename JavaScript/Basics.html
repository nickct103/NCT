<!-- 
    # JavaScript:
        - JavaScript is a programming language that allows you to implement complex features on web pages.
        -   Programming Language: A set of instructions that a computer can understand to perform specific tasks.
        -   Interpreted Language: Code is executed line by line, not compiled into machine code beforehand.
        -   High-Level Language: Abstracts away complex details of the computer's hardware.
        -   Multi-Paradigm: Supports different programming styles (e.g., procedural, object-oriented, functional).
        - Used in web development to make websites dynamic/ interactive.
        - Used to add logic in Client (FE), Server (BE), Mobile Applications, etc.

    - Add JavaScript to HTML:
        - script tag (Head/Body)
            - Internal: <script>console.log("Hi")</script>
            - External: <script src="[link]"></script>

    - Data Types ***
        - Primitive:
            - String: "Hello"
            - Number: 123
            - Boolean: true/false
            - Null: null (intentional absence of value or empty placeholder)
            - Undefined: undefined (variable declared but not assigned)
            - Symbol: unique identifier (ES6)
        - Non-Primitive:
            - Object: {key: value}
            - Array: [1, 2, 3]

    - Variables & Constants: Storage for saving data
        - Variables: Containers for storing data values. Changing over time. (var)
            - Declaration: let, var (old, function-scoped)
            - Assignment: =
            - Example: let name = "Nick"
        - Constants: Variables that cannot be reassigned after their initial assignment. Remains fixed over time. (const)
            - Declaration: const
            - Example: const PI = 3.14
        - Syntax:
            - var x
            - const name
        - Declare vs Initialize vs Assign:
            - Declare: var x
            - Initialize: var x = 10
            - Assign: x = 5 
        - Naming Conventions:
            - Cannot start with numbers or special characters (except $ and _)
            - Camel Case: let myVariableName- cannot contain spaces- most used
            - Underscore: let my_variable_name
            - Pascal Case: let MyVariableName (for classes)
            - Kebab Case: let my-variable-name (not valid in JS)      
            - Cannot use reserved keywords (e.g., let, const, if, else, function, return, etc.)
        

    - Display Output:
        - Console: console.log("Hi") **
        - alert(): Method to show basic popup on the webpage.
        - document.write(): Writes directly to the HTML document (not recommended for modern web development). Appends data to the HTML document. 
        - document.getElementById().innerHTML: Change content of specific HTML element. Add HTML inside and element with a specific ID.

    - Additional note:
        - JS is loosely typed language
        - Comment:
            - Single-line: // comment
            - Multi-line: /* comment */- Similar to CSS comments
