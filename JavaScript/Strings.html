<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings</title>
</head>
<body>
    <h1>Strings</h1>
    <p id="description"></p>
    <script>
        /*
            # Strings:
                - "Double Quotes", 'Single Quotes', `Backticks`
                    - Multi-line strings with backticks
                - Next Line Character: \n
                - Escape Characters: \", \', \\n, \t
                    - Used to include special characters in strings
                    - \t- Tab space character
                - Accessing Characters: [index], charAt(index)
                    - Syntax: str[index]
                        - Index starts at 0: Position - 1
                        - String of length 'n', index range: 0 -> n-1

                - Concatenation: +, `${}`
                    - '+'' - coperator wors as a concatenation operator with strings
                    - String + String = String
                    - String + Any data = String
                    - Any data + String = String

                -Properties:
                    - length: Number of characters in a string
                -Methods:
                    - toUpperCase()
                    - toLowerCase()
                    - trim() - removes whitespace from both ends of a string
                    - charAt(index) - returns the character at the specified index
                    - **indexOf(substring) - returns the index of the first occurrence of the specified substring. If not found, returns -1
                    - **includes(substring) - checks if the string contains the specified substring, returns true or false
                    - **slice(start, end) - extracts a section of the string and returns it as a new string
                         - startsWith(substring) - checks if the string starts with the specified substring, returns true or false
                        - endsWith(substring) - checks if the string ends with the specified substring, returns true or false
                        - startIndexOf(substring, startIndex) - returns the index of the first occurrence of the specified substring, starting the search at startIndex
                        - lastIndexOf(substring) - returns the index of the last occurrence of the specified substring. If not found, returns -1
                        - No arguements- will return the original string
                        -Alternatives:
                        - substring(start, end) - extracts characters from start to end (not including end) and returns a new string
                        - substr(start, length) - extracts a substring starting from the specified start index and of the specified length
                            - negative start index counts from the end of the string
                    - replace(oldSubstring, newSubstring) - replaces the first occurrence of oldSubstring with newSubstring
                    - replaceAll(oldSubstring, newSubstring) - replaces all occurrences of oldSubstring with newSubstring
                    - split(separator) - splits the string into an array of substrings based on the specified separator
                    - concat(string1, string2, ...) - joins two or more strings and returns a new string
                        - Alternative to + operator for concatenation
                    - charAt(index) - returns the character at the specified index
                        - Alternative: str[index]
                    
        */

    //    var firstname = 'Maria'
    //    var lastname = "Smith"
       var fullName = 'Anne'
    //    console.log(fullName.indexOf('n'))
    //    console.log(fullName.lastIndexOf('n'))
    console.log(fullName.includes('n'))

    </script>
</body>
</html>
