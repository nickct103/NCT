<!-- 
    # Operators in JavaScript
        -Arithmetic Operators **
            - Addition (+)
            - Subtraction (-)
            - Multiplication (*)
            - Division (/)
            - Modulus (%)(Remainder)
            - Exponentiation (**)
            - Increment (++)
                - Pre-increment (++x): Increment, then access
                - Post-increment (x++): Access, then increment
            - Decrement (--)
                - Pre-decrement (--x): Decrement, then access
                - Post-decrement (x--): Access, then decrement
            - Assignment Operators (=, +=, -=, *=, /=, %=, **=)
                - Assignment (=)
                - Addition Assignment (+=)
                - Subtraction Assignment (-=)
                - Multiplication Assignment (*=)
                - Division Assignment (/=)
                - Modulus Assignment (%=)
                - Exponentiation Assignment (**=)
            - Comparison Operators ** (==, ===, !=, !==, >, <, >=, <=)
                - *Usually used in conditional statements and will return a boolean value (true or false)*
                - Equal to (==) (Equality operator)- Checks for value and not type
                - Strict equal to (===) (Identity operator)- Checks for both value and type
                - Not equal to (!=) (Inequality operator)- Not equal to value
                - Strict not equal to (!==) (Not identical operator)- Not equal to value or type
                - Greater than (>)
                - Less than (<)
                - Greater than or equal to (>=)
                - Less than or equal to (<=)
            - Logical Operators ** (&&, ||, !)
                - Logical AND (&&): All TRUE to return TRUE
                - Logical OR (||): One TRUE to return TRUE
                - Logical NOT (!): True to False and False to True
            - Bitwise Operators (&, |, ^, ~, <<, >>, >>>)
