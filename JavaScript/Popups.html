<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popups in JS</title>
</head>
<body>
    <h1>Popups in JavaScript</h1>

    <script>
        // alert("You have successfully logged in!")
        // var result = confirm("Are you sure you want to log off?")
        // console.log(result) // true/false
        var result = prompt('Enter your name')
        console.log(result)
    </script>
</body>
</html>

<!-- 
    # Popups in JavaScript:
        - alert(): Displays a message and an OK button. Used for simple notifications.
            - Inform the user
            - One button: OK
        - confirm(): Displays a message with OK and Cancel buttons. Returns true if OK is clicked, false if Cancel is clicked.
            - Ask user yes/no based questions.
            - Two buttons: OK and Cancel
        - prompt(): Displays a message prompting the user to input text. Returns the input value or null if Cancel is clicked.  
            - Used to get input from the user.
            - Two buttons: OK and Cancel
            - Input field for user to type in their response.
-->
