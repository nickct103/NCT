    <h1>Loops in JavaScript</h1>
    <script>
       /*
        # Loops: Something to be executed in a repeated basis
            -Terms:
              - Iteration: Individual cycles
              - Condition: Determine to proceed or halt
            - Process:
                - In each iteration, condition will be checked
                - Only if condition is true, iteration will be processed
                - Else, loop will break
            - One similarity in all types of loops:
                - Initialization
                - Condition
                - Increment/ Decrement
            - Types of loops:
                - 'while' loop * - executes as long as a specified condition is true.  "Iteration" refers to each cycle of the loop.
                    - Syntax:
                        // Initialization
                        while (condition) {
                            // loop logic
                            // increment/decrement
                        }
                - 'do-while' loop * - similar to while loop, but guarantees at least one execution of the loop body before checking the condition. (Similar to while loop, but checks condition after executing the loop body)
                    - Syntax:
                        // Initialization
                        do {
                            // loop logic
                            // increment/decrement
                        } while (condition);
                - 'for' loop - used when the number of iterations is known beforehand. (Combines initialization, condition, and increment/decrement in a single line)
                    - Syntax:
                        for (initialization; condition; increment/decrement) {
                            // loop logic
                        }

       */
