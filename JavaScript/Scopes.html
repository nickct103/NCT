<body>
    <h1>Var Let Const</h1>
    <script>
        /*
            # Scopes: Space where a variable can be accessed
                - Global Scope: Variable can be accessed anywhere in the file
                - Local Scope
                    - Function Scope
                    - Block Scope ({}): Variable can be accessed within the block


            # Declare Variables
                - var. let, const
                -ES6: ECMAScript 6 (2015)
                    - let, const

                - var: Variables
                    - can be re-declared and updated
                    -Global Scope
                - let: Variables
                    - can be updated, but not re-declared
                    - can be reassigned
                    - Block Scope
                - const: Constants
                    - cannot be updated or re-declared
                    - cannot be reassigned
                    - Block Scope
        */

        // var x = 10; // Global Scope
