<!--
    #Lists (Paired Tags): 
        -Display multiple related elements
        -<ul></ul>: unordered Lists
        -<ol></ol>: ordered lists
        -Tags
            -<ul></ul>: unordered Lists
            -<ol></ol>: ordered lists
            -<li></li>: List item

    # Images:
        -Tags: <img>
        -Syntax: <img src="link of the image">
        -Just an <img> tag will not be enough. It needs more information
        -Default size for image is from the actual source for the image
        -From your local computer, you can upload your image to the folder that you are working with your code and use the title of that image as the source (src)

    #Links:
        -Reference to another webpage
        -Tag: <a> (Anchor)
        -Syntax: <a href="link-to-another-webpage"></a> 

    #Attributes:
        -Add more properties to HTML tags
        -The attribute will be added to the opening tag
        -Not all tags have attributes
        -Syntax: <tag1 attribute1="value1"></tag1> (any tag)
        -ex: <h1 color="red">Test</h1>
            -img
                -src: Source of image (mandatory attribute)
                -alt(optional): Alternate text if image fails to load
                -height: set the height (pixels) (optional)
                -width: set the width (pixels) (optional)
            -<a></a>
                -href (mandatory): Hypertext/URL reference
                -target (optional):
                    -_self (default): Load the link in the same tab
                    -_blank: load the link in a new tab.
-->
