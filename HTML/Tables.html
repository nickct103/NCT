    #Tables:
        -Display data in rows and column format
        -Tags:
            -<table></table>: Wrapper tag for HTML Tables
            -<tr></tr>: Table rows
            -<th></th>: Table Headers
            -<td></td>: Table data (cells)
        -Boilerplate syntax for tables:
            <table>
            <tr>
                <th>Table Header 1</th>
                <th>Table Header 2</th>
            </tr>
            <tr>
                <td>Table Data 1</td>
                <td>Table Data 2</td>
            </tr>
        -Span
            - Spanning is another word for Merge
            -Span can never be added to tr
            - colspan: column span
                -Data to be same across 'n' number of columns within a ros
            - rowspan: row span
                -Data to be same across 'n' number of row within a column

-->
