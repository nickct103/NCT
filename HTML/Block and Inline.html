<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Block and Inline Tags</title>
</head>
<body>
    <h1>Block and Inline Tags</h1>
   <!-- Block elements --> 
    <div>
        <h1>Heather</h1>
        <p>Heather</p>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>
        <hr>
    </div>
    
    <!-- Inline elements -->
     <div> 
        <a href="https://www.facebook.com">Heather</a>
        <a href="https://www.facebook.com">Heather</a>
        <a href="https://www.facebook.com">Heather</a>

        <img src="images/istockphoto-1435220822-612x612.jpg" alt="Developer" width="100", height="100">
        <img src="images/istockphoto-1435220822-612x612.jpg" alt="Developer" width="100", height="100">
        <img src="images/istockphoto-1435220822-612x612.jpg" alt="Developer" width="100", height="100">
    </div>
</body>
</html>


<!--
    # Block Tags
        -HTML tags which take up the entire horizontal space
        - EX: h1-h6, p, hr, ul, ol, li, div, etc.
        - IT WILL TAKE UP THE ENTIRE HORIZONTAL SPACE ON THE CODE
    # Inline Tags
        -HTML tags which take space = to their dimensions
        - Ex: <a>, img, table, span, etc.

    # Additional notes:
        -<div> and <span> can be used to group code together, which makes it easy to debug. It hels organize code better when inspecting pages.
-->
