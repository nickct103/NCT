        #parent {
            border: 2px solid black;
            width: 300px;
            height: 600px;
            box-sizing: border-box;
        }

        .child {
            width: 300px;
            height: 300px;
            border: 2px solid black;
            box-sizing: border-box;
        }

<body>
    <h1>Box Model</h1>

    <div id="parent">
        <div class="child">CHILD</div>
        <div class="child">CHILD</div>
    </div>
</body>

<!-- 
    # Box Model: ***MIT
        -To better determine the overall dimensions of an element
        -4 different parts
            -Content (The Blue Area): Actual dimension of the element
            -Padding (The Green Area): Space inside the border
            -Border Width (THe Yellow color area): Border width
            -Margin (The Orange area): Space outside the border
        -'box-sizing': Control the dimension of an element
            -content-box (default): 
                -Width and height only applies to the content part
            -border-box: (like an airline suitcase)
                -width and height applies to [content + padding + border}
                    -These three will apply to the box sizing
-->
