        html {

        body {
            background-color: #eee;

        #container {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        #container .card {
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            text-align: center;
            padding-bottom: 10px;
            border-radius: 10px;
            width: 300px

        }

        #container .card p, #container .card button{
            font-size: 1.5rem;
            margin: 0.5rem
        }
        #container .card img {
            border-radius: 10px 10px 0 0;
            width: 100%;
        }
        #container .card button {
            background-color: green;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px
        }

        @media screen and (max-width: 480px) {
            html {
                font-size: 12px;
            }

            h1 {
                font-size: 3em;
            }
            #container {
                display: flex;
                flex-direction: column;
            }

            #container .card {
                width: 250px;
                margin: 10px auto;
            }
        }

<!-- 
    #Media Queries:
        -Style rules for different screen sizes
        -Syntax:
            @media mediaType and (condition) {
            // style to be applied to those devices with match the above condition
            }

        -mediaType
            -screen ***: Screen
            -print: Print

        -Condition
            -max-width***: Device width leser than or equals to the given width
            -min-width***: Device width greater than or equals to the given width
            -max-height: Device height lesser than or equals to the given height
            -min-height: Device height greater than or equals to the given height
        -Two Approaches
            -Desktop-first approach:
                -Start with desktop, then add seperate rules for mobile
            -Mobile-first approach:
                -Start with mobile, then add separate rules for desktop

        -Breakpoints
            -Laptops/Desktop: 992 px ***
            -tablets: >480px and <992
            -Mobile: <= 480px ***

    #Bootstrap- Place to check the width of different devices.- get breakpoints
-->
